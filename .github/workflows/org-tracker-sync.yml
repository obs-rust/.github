name: org-tracker-sync

# Keeps the obs-rust Multiview project (the org-wide master list of open
# issues and PRs) in step with every repo in the org. One workflow here
# covers all repos, so no repo needs its own add-to-project workflow or
# secret, and new repos join on their own.
#
# Auth: the "obs-rust Multiview" GitHub App (ID 5460858), installed on all repos with
# Projects: read/write (org) and Issues, Pull requests, Metadata: read.
#   vars.PROJECT_APP_CLIENT_ID    the App's client ID
#   vars.PROJECT_NUMBER           the Tracker project's number
#   secrets.PROJECT_APP_PRIVATE_KEY  the App's private key (PEM)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-tracker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: vars.PROJECT_APP_CLIENT_ID != '' && vars.PROJECT_NUMBER != ''
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: astral-sh/setup-uv@v6

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          owner: obs-rust

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: obs-rust
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: uv run scripts/org_tracker_sync.py
